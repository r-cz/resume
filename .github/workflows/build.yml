name: Build resume

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          latexmk_use_xelatex: true

      - name: Check for layout warnings
        run: |
          if grep -E "Overfull \\\\hbox|^! " resume.log; then
            echo "::warning::LaTeX reported overfull boxes or errors (see above)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: resume
          path: resume.pdf

      - name: Refuse to release with placeholders
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if grep -n '\\tbd{' --include='*.tex' --exclude=config.tex -r .; then
            echo "::error::Fill in every \\tbd{} placeholder before tagging a release"
            exit 1
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: resume.pdf
